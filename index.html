<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Assignment AI & Notes Studio</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0e14;
      color: #e2e8f0;
      height: 100dvh;
      overflow: hidden;
    }
    .app-shell {
      display: flex;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      position: relative;
    }
    .sidebar {
      width: 320px;
      flex-shrink: 0;
      background: #111622;
      border-right: 1px solid #1e293b;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      z-index: 30;
    }
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-vault-btn {
      display: none;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.72);
      z-index: 25;
    }
    .backdrop.open { display: block; }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100dvh;
    }
    .topbar {
      padding: 10px 14px;
      background: #111622;
      border-bottom: 1px solid #1e293b;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 auto;
      min-width: 180px;
    }
    .cache-badge {
      font-size: 0.72rem;
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.35);
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .topbar input, .topbar select, .sidebar input, .sidebar select {
      background: #0b0e14;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.88rem;
    }
    .toolbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .tool-btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 7px 11px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      min-height: 36px;
    }
    .tool-btn:hover { border-color: #6366f1; }
    .install-btn {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    .install-btn:hover {
      background: #0369a1;
      border-color: #7dd3fc;
    }

    .upload-box {
      border: 2px dashed #334155;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      background: #0f1420;
      transition: 0.2s;
    }
    .upload-box:hover { border-color: #6366f1; }
    .file-list {
      flex: 1;
      min-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .file-item {
      background: #1a2234;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.83rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      overflow-wrap: anywhere;
    }
    .unit-tag {
      display: inline-block;
      background: #27344f;
      color: #93c5fd;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.72rem;
      margin-top: 4px;
    }
    .file-item button.del {
      background: #dc2626;
      border: none;
      color: #fff;
      border-radius: 4px;
      padding: 5px 9px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .math-drawer {
      display: none;
      padding: 10px 14px;
      background: #131b2c;
      border-bottom: 1px solid #1e293b;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.85rem;
    }
    .math-drawer input {
      flex: 1 1 180px;
      min-width: 140px;
      background: #0b0e14;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: min(840px, 94%);
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 0.94rem;
    }
    .msg.user { align-self: flex-end; background: #4f46e5; color: #fff; }
    .msg.bot { align-self: flex-start; background: #161d2d; border: 1px solid #263045; }
    .msg .preview-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .msg img.preview {
      display: block;
      max-width: min(240px, 70vw);
      max-height: 190px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .sources {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #2a354d;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .source-chip {
      background: #0f172a;
      padding: 6px 10px;
      border-radius: 6px;
      margin-top: 6px;
      border-left: 3px solid #38bdf8;
    }

    .composer-wrap {
      background: #111622;
      border-top: 1px solid #1e293b;
      padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .attachment-bar {
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: #182235;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    .attachment-bar button {
      background: transparent;
      border: none;
      color: #f87171;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 6px;
    }
    .input-bar {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .input-bar textarea {
      flex: 1;
      min-width: 0;
      background: #0b0e14;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      padding: 10px;
      resize: none;
      min-height: 46px;
      max-height: 130px;
      font-size: 0.92rem;
    }
    .input-bar button.send-btn {
      background: #6366f1;
      color: #fff;
      border: none;
      padding: 0 18px;
      height: 46px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .input-bar button:disabled { opacity: 0.6; cursor: not-allowed; }

    @media (max-width: 820px) {
      .vault-toggle-btn { display: inline-flex; align-items: center; gap: 4px; }
      .close-vault-btn { display: inline-block; }
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: min(86vw, 330px);
        transform: translateX(-100%);
        transition: transform 0.22s ease;
        box-shadow: 8px 0 28px rgba(0, 0, 0, 0.55);
      }
      .sidebar.open { transform: translateX(0); }
      .toolbar-actions {
        width: 100%;
        overflow-x: auto;
        padding-bottom: 2px;
        flex-wrap: nowrap;
      }
      .input-bar {
        flex-wrap: wrap;
      }
      .input-bar textarea {
        flex: 1 1 100%;
        order: -1;
      }
      .input-bar #attachBtn {
        flex: 1;
      }
      .input-bar button.send-btn {
        padding: 0 20px;
      }
    }

    @media print {
      .sidebar, .topbar, .math-drawer, .composer-wrap, .backdrop { display: none !important; }
      html, body, .app-shell, .main, .chat { height: auto; overflow: visible; background: #fff; color: #000; }
      .msg.bot { background: #f8fafc; color: #000; border: 1px solid #cbd5e1; }
    }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h3 style="margin:0">Course Notes Vault</h3>
        <button type="button" class="close-vault-btn" id="closeVaultBtn">✕ Close</button>
      </div>
      <div>
        <label style="font-size:0.78rem;color:#94a3b8;display:block;margin-bottom:4px">Upload Unit Tag</label>
        <input type="text" id="uploadUnit" value="ACS 410" placeholder="e.g. ACS 410, ACS 413" style="width:100%" />
      </div>
      <label class="upload-box">
        <strong>+ Upload Notes / Slides</strong><br/>
        <span style="font-size:0.8rem;color:#94a3b8">Select 1 or more: PDF (OCR), PPTX, DOCX, TXT, MD</span>
        <input type="file" id="fileInput" multiple accept=".pdf,.pptx,.docx,.txt,.md" style="display:none" />
      </label>
      <div id="uploadStatus" style="font-size:0.8rem;color:#38bdf8"></div>
      <div>
        <label style="font-size:0.78rem;color:#94a3b8;display:block;margin-bottom:4px">Filter Active Unit</label>
        <select id="unitFilter" style="width:100%">
          <option value="All">All Units</option>
        </select>
      </div>
      <div class="file-list" id="fileList"></div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div class="brand-row">
          <button type="button" class="vault-toggle-btn" id="openVaultBtn">📚 Notes</button>
          <span style="font-weight:700;font-size:0.95rem">Assignment AI & Notes Studio</span>
          <span class="cache-badge" id="cacheStatus">Device Cache Ready</span>
        </div>
        <div class="toolbar-actions">
          <button type="button" class="tool-btn install-btn" id="installAppBtn" style="display:none">📲 Install App</button>
          <select id="writingStyle" title="Answer phrasing style">
            <option value="standard">Style: Standard Tutor</option>
            <option value="normal">Style: Normal English</option>
          </select>
          <button type="button" class="tool-btn" id="normalRewriteBtn">✍️ Normal English</button>
          <button type="button" class="tool-btn" id="practiceBtn">📝 Practice Drill</button>
          <button type="button" class="tool-btn" id="mathToggleBtn">∑ Math Check</button>
          <button type="button" class="tool-btn" id="exportDocxBtn">⬇ Export DOCX</button>
          <button type="button" class="tool-btn" id="exportMdBtn">⬇ Export MD</button>
          <button type="button" class="tool-btn" onclick="window.print()">🖨 Print / PDF</button>
          <button type="button" class="tool-btn" id="clearChatBtn">🗑 Clear Chat</button>
        </div>
      </div>

      <div class="math-drawer" id="mathDrawer">
        <strong>Math Check:</strong>
        <input type="text" id="mathExpr" placeholder="e.g. (1 + 0.08)**(-4) or 3*x + 5 = 20" />
        <button type="button" class="tool-btn" id="verifyMathBtn">Verify</button>
        <span id="mathResult" style="color:#38bdf8"></span>
      </div>

      <div class="chat" id="chat"></div>

      <div class="composer-wrap">
        <div class="attachment-bar" id="attachmentBar">
          <span id="attachmentLabel"></span>
          <button type="button" id="clearAttachmentBtn" title="Remove attachments">✕</button>
        </div>
        <div class="input-bar">
          <button type="button" class="tool-btn" id="attachBtn">📎 Photos / Docs / Slides</button>
          <input type="file" id="questionFileInput" multiple accept=".png,.jpg,.jpeg,.webp,.pdf,.pptx,.docx,.txt,.md" style="display:none" />
          <textarea id="question" placeholder="Type your assignment question or practice topic (Enter to send, Shift+Enter for newline)..."></textarea>
          <button type="button" class="send-btn" id="sendBtn">Ask</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CACHE_KEYS = {
      filesByUnit: "notes_studio_cached_files_v1",
      allUnits: "notes_studio_cached_units_v1",
      chatItems: "notes_studio_cached_chat_v1",
      history: "notes_studio_cached_history_v1",
      sessionLog: "notes_studio_cached_session_log_v1",
      selectedUnit: "notes_studio_selected_unit_v1",
      uploadUnit: "notes_studio_upload_unit_v1"
    };

    const sidebar = document.getElementById("sidebar");
    const backdrop = document.getElementById("backdrop");
    const openVaultBtn = document.getElementById("openVaultBtn");
    const closeVaultBtn = document.getElementById("closeVaultBtn");
    const installAppBtn = document.getElementById("installAppBtn");
    const cacheStatusEl = document.getElementById("cacheStatus");
    const fileInput = document.getElementById("fileInput");
    const uploadUnitEl = document.getElementById("uploadUnit");
    const unitFilterEl = document.getElementById("unitFilter");
    const fileList = document.getElementById("fileList");
    const uploadStatus = document.getElementById("uploadStatus");
    const chat = document.getElementById("chat");
    const questionEl = document.getElementById("question");
    const writingStyleEl = document.getElementById("writingStyle");
    const normalRewriteBtn = document.getElementById("normalRewriteBtn");
    const attachBtn = document.getElementById("attachBtn");
    const questionFileInput = document.getElementById("questionFileInput");
    const attachmentBar = document.getElementById("attachmentBar");
    const attachmentLabel = document.getElementById("attachmentLabel");
    const clearAttachmentBtn = document.getElementById("clearAttachmentBtn");
    const sendBtn = document.getElementById("sendBtn");
    const practiceBtn = document.getElementById("practiceBtn");
    const mathToggleBtn = document.getElementById("mathToggleBtn");
    const mathDrawer = document.getElementById("mathDrawer");
    const mathExprEl = document.getElementById("mathExpr");
    const verifyMathBtn = document.getElementById("verifyMathBtn");
    const mathResultEl = document.getElementById("mathResult");
    const clearChatBtn = document.getElementById("clearChatBtn");

    const WELCOME_TEXT =
      "Tap 📚 Notes on mobile (or use the left vault on desktop) to upload notes or slides with a unit tag like ACS 410, filter by unit, ask questions by typing or attaching multiple photos/documents/slides, switch to Normal English, run 📝 Practice Drill, or export to DOCX / MD / PDF.";

    let pendingAttachments = [];
    let deferredInstallPrompt = null;

    function readJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function writeJson(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        console.warn("Cache storage warning:", e);
      }
    }

    let chatItems = readJson(CACHE_KEYS.chatItems, []);
    let chatHistory = readJson(CACHE_KEYS.history, []);
    let sessionLog = readJson(CACHE_KEYS.sessionLog, []);

    uploadUnitEl.value = localStorage.getItem(CACHE_KEYS.uploadUnit) || "ACS 410";
    uploadUnitEl.addEventListener("change", () => {
      localStorage.setItem(CACHE_KEYS.uploadUnit, uploadUnitEl.value);
    });

    const savedUnit = localStorage.getItem(CACHE_KEYS.selectedUnit) || "All";
    unitFilterEl.value = savedUnit;

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      if (installAppBtn) installAppBtn.style.display = "inline-block";
    });

    if (installAppBtn) {
      installAppBtn.addEventListener("click", async () => {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        installAppBtn.style.display = "none";
      });
    }

    window.addEventListener("appinstalled", () => {
      deferredInstallPrompt = null;
      if (installAppBtn) installAppBtn.style.display = "none";
    });

    function setVaultOpen(isOpen) {
      sidebar.classList.toggle("open", isOpen);
      backdrop.classList.toggle("open", isOpen);
    }

    openVaultBtn.addEventListener("click", () => setVaultOpen(true));
    closeVaultBtn.addEventListener("click", () => setVaultOpen(false));
    backdrop.addEventListener("click", () => setVaultOpen(false));

    function renderMath(el) {
      if (typeof renderMathInElement === "function") {
        renderMathInElement(el, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      }
    }

    function updateAttachmentBar() {
      if (!pendingAttachments.length) {
        attachmentLabel.textContent = "";
        attachmentBar.style.display = "none";
        return;
      }
      attachmentLabel.textContent = `Attached (${pendingAttachments.length}): ${pendingAttachments.map(f => f.name).join(", ")}`;
      attachmentBar.style.display = "flex";
    }

    attachBtn.addEventListener("click", () => questionFileInput.click());

    questionFileInput.addEventListener("change", () => {
      const files = Array.from(questionFileInput.files || []);
      if (!files.length) return;
      for (const f of files) {
        const exists = pendingAttachments.some(x => x.name === f.name && x.size === f.size);
        if (!exists) pendingAttachments.push(f);
      }
      updateAttachmentBar();
    });

    function clearAttachment() {
      pendingAttachments = [];
      questionFileInput.value = "";
      updateAttachmentBar();
    }

    clearAttachmentBtn.addEventListener("click", clearAttachment);

    mathToggleBtn.addEventListener("click", () => {
      const shown = mathDrawer.style.display === "flex";
      mathDrawer.style.display = shown ? "none" : "flex";
      if (!shown) mathExprEl.focus();
    });

    verifyMathBtn.addEventListener("click", async () => {
      const expr = mathExprEl.value.trim();
      if (!expr) return;
      mathResultEl.textContent = "Checking...";
      const fd = new FormData();
      fd.append("expression", expr);
      const res = await fetch("/verify-math", { method: "POST", body: fd });
      const data = await res.json();
      mathResultEl.textContent = data.result || "";
      mathResultEl.style.color = data.ok ? "#34d399" : "#f87171";
    });

    mathExprEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") verifyMathBtn.click();
    });

    function renderFilesVault(files, units) {
      const currentFilter = unitFilterEl.value || "All";
      const allUnits = ["All", ...(units || [])];
      unitFilterEl.innerHTML = allUnits
        .map(u => `<option value="${u.replace(/"/g, "&quot;")}">${u}</option>`)
        .join("");
      if (allUnits.includes(currentFilter)) {
        unitFilterEl.value = currentFilter;
      }

      fileList.innerHTML = (files || []).map(f => `
        <div class="file-item">
          <div>
            <strong>${f.filename}</strong><br/>
            <span class="unit-tag">${f.course_unit}</span>
            <span style="color:#94a3b8;margin-left:6px">${f.chunks} chunks</span>
          </div>
          <button class="del" onclick="delFile('${encodeURIComponent(f.filename)}', '${encodeURIComponent(f.course_unit)}')">X</button>
        </div>
      `).join("");
    }

    function hydrateCachedVault() {
      const cachedMap = readJson(CACHE_KEYS.filesByUnit, {});
      const cachedUnits = readJson(CACHE_KEYS.allUnits, []);
      const unitKey = (unitFilterEl.value || "All").toLowerCase();
      const files = cachedMap[unitKey] || cachedMap["all"] || [];
      if (files.length || cachedUnits.length) {
        renderFilesVault(files, cachedUnits);
        cacheStatusEl.textContent = `Cached (${files.length} notes)`;
      }
    }

    async function loadFiles() {
      const selectedUnit = unitFilterEl.value || "All";
      localStorage.setItem(CACHE_KEYS.selectedUnit, selectedUnit);
      try {
        const res = await fetch("/files?course_unit=" + encodeURIComponent(selectedUnit));
        const data = await res.json();
        const files = data.files || [];
        const units = data.units || [];

        const cachedMap = readJson(CACHE_KEYS.filesByUnit, {});
        cachedMap[selectedUnit.toLowerCase()] = files;
        writeJson(CACHE_KEYS.filesByUnit, cachedMap);
        writeJson(CACHE_KEYS.allUnits, units);

        renderFilesVault(files, units);
        cacheStatusEl.textContent = `Synced (${files.length} notes)`;
      } catch {
        hydrateCachedVault();
        cacheStatusEl.textContent = "Offline / Device Cache";
      }
    }

    unitFilterEl.addEventListener("change", () => {
      hydrateCachedVault();
      loadFiles();
    });

    async function delFile(encodedName, encodedUnit) {
      await fetch(`/files/${encodedName}?course_unit=${encodedUnit}`, { method: "DELETE" });
      loadFiles();
    }

    fileInput.addEventListener("change", async () => {
      const selected = Array.from(fileInput.files || []);
      if (!selected.length) return;
      const unitVal = uploadUnitEl.value.trim() || "General";
      let done = 0;
      for (const file of selected) {
        done += 1;
        uploadStatus.textContent = `Indexing (${done}/${selected.length}) ${file.name} (${unitVal})...`;
        const fd = new FormData();
        fd.append("file", file);
        fd.append("course_unit", unitVal);
        try {
          const res = await fetch("/upload", { method: "POST", body: fd });
          const data = await res.json();
          if (!res.ok) {
            uploadStatus.textContent = `Error indexing ${file.name}: ${data.detail || res.status}`;
            continue;
          }
          uploadStatus.textContent = `Indexed (${done}/${selected.length}) ${data.filename} [${data.course_unit}] (${data.chunks} chunks)${data.note || ""}`;
        } catch (err) {
          uploadStatus.textContent = `Upload failed for ${file.name}: ${err}`;
        }
      }
      fileInput.value = "";
      await loadFiles();
    });

    function buildMessageElement(item) {
      const div = document.createElement("div");
      div.className = "msg " + item.cls;
      if (item.text) {
        const t = document.createElement("div");
        t.textContent = item.text;
        div.appendChild(t);
      }
      if (item.nonImages && item.nonImages.length) {
        const fBadge = document.createElement("div");
        fBadge.style.marginTop = "6px";
        fBadge.style.fontSize = "0.85rem";
        fBadge.style.opacity = "0.9";
        fBadge.textContent = `📄 ${item.nonImages.join(", ")}`;
        div.appendChild(fBadge);
      }
      if (item.images && item.images.length) {
        const grid = document.createElement("div");
        grid.className = "preview-grid";
        for (const src of item.images) {
          const img = document.createElement("img");
          img.className = "preview";
          img.src = src;
          img.alt = "Attached image";
          grid.appendChild(img);
        }
        div.appendChild(grid);
      }
      if (item.sources && item.sources.length) {
        const sDiv = document.createElement("div");
        sDiv.className = "sources";
        sDiv.innerHTML = "<strong>Matched Sources:</strong>" + item.sources.map(s => {
          const unitLabel = s.filename && s.filename.toLowerCase().endsWith(".pptx") ? "Slide" : "Page";
          return `<div class="source-chip"><b>${s.filename} [${s.course_unit || "General"}] (${unitLabel} ${s.page})</b>: ${s.snippet.slice(0, 180)}...</div>`;
        }).join("");
        div.appendChild(sDiv);
      }
      renderMath(div);
      return div;
    }

    function persistChatState() {
      // Keep recent messages and avoid oversized base64 images in localStorage
      const safeItems = chatItems.slice(-40).map(it => ({
        ...it,
        images: (it.images || []).filter(u => !u.startsWith("data:"))
      }));
      writeJson(CACHE_KEYS.chatItems, safeItems);
      writeJson(CACHE_KEYS.history, chatHistory.slice(-12));
      writeJson(CACHE_KEYS.sessionLog, sessionLog.slice(-60));
    }

    function renderFullChat() {
      chat.innerHTML = "";
      const welcome = document.createElement("div");
      welcome.className = "msg bot";
      welcome.textContent = WELCOME_TEXT;
      chat.appendChild(welcome);

      for (const item of chatItems) {
        chat.appendChild(buildMessageElement(item));
      }
      chat.scrollTop = chat.scrollHeight;
    }

    function addMsg(text, cls, sources = [], attachments = [], saveToCache = true) {
      const nonImages = attachments.filter(a => !/\.(png|jpe?g|webp)$/i.test(a.name)).map(a => a.name);
      const images = attachments
        .filter(a => /\.(png|jpe?g|webp)$/i.test(a.name))
        .map(a => URL.createObjectURL(a));

      const item = { text, cls, sources, nonImages, images };
      const div = buildMessageElement(item);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;

      if (saveToCache) {
        chatItems.push({ ...item, images: [] });
        persistChatState();
      }
      return div;
    }

    clearChatBtn.addEventListener("click", () => {
      chatItems = [];
      chatHistory = [];
      sessionLog = [];
      persistChatState();
      renderFullChat();
    });

    async function sendQuestion() {
      const q = questionEl.value.trim();
      const atts = [...pendingAttachments];
      if (!q && !atts.length) return;

      setVaultOpen(false);
      addMsg(q, "user", [], atts, true);

      const attNames = atts.map(a => a.name).join(", ");
      const userSummary = [q, attNames ? `[Attached: ${attNames}]` : ""].filter(Boolean).join(" ");
      if (userSummary) chatHistory.push({ role: "user", text: userSummary });
      sessionLog.push(`### Question\n${userSummary}`);
      persistChatState();

      questionEl.value = "";
      clearAttachment();

      const fd = new FormData();
      fd.append("question", q);
      fd.append("course_unit", unitFilterEl.value || "All");
      fd.append("history", JSON.stringify(chatHistory.slice(-6)));
      fd.append("style", writingStyleEl.value);
      for (const a of atts) {
        fd.append("attachments", a);
      }

      sendBtn.disabled = true;
      const thinkingMsg = addMsg("Analyzing your question and course notes...", "bot", [], [], false);

      try {
        const res = await fetch("/ask", { method: "POST", body: fd });
        const data = await res.json();
        thinkingMsg.remove();
        addMsg(data.answer, "bot", data.sources || [], [], true);
        if (data.answer) {
          chatHistory.push({ role: "assistant", text: data.answer });
          sessionLog.push(`### Answer\n${data.answer}`);
          persistChatState();
        }
      } catch (err) {
        thinkingMsg.remove();
        addMsg("Network error: " + err, "bot", [], [], false);
      } finally {
        sendBtn.disabled = false;
      }
    }

    normalRewriteBtn.addEventListener("click", async () => {
      const typed = questionEl.value.trim();
      const lastBot = [...chat.querySelectorAll(".msg.bot")].pop();
      const targetText = typed || (lastBot && lastBot.firstChild ? lastBot.firstChild.textContent.trim() : "");
      if (!targetText) return;

      if (typed) {
        addMsg(`Rewrite in normal English:\n${typed}`, "user", [], [], true);
        questionEl.value = "";
      }

      const fd = new FormData();
      fd.append("text", targetText);

      normalRewriteBtn.disabled = true;
      const thinkingMsg = addMsg("Rewriting into normal English...", "bot", [], [], false);
      try {
        const res = await fetch("/humanize", { method: "POST", body: fd });
        const data = await res.json();
        thinkingMsg.remove();
        addMsg(data.answer, "bot", [], [], true);
        if (data.answer) {
          chatHistory.push({ role: "assistant", text: data.answer });
          sessionLog.push(`### Normal English Version\n${data.answer}`);
          persistChatState();
        }
      } catch (err) {
        thinkingMsg.remove();
        addMsg("Network error: " + err, "bot", [], [], false);
      } finally {
        normalRewriteBtn.disabled = false;
      }
    });

    practiceBtn.addEventListener("click", async () => {
      const topic = questionEl.value.trim();
      const unit = unitFilterEl.value || "All";
      addMsg(`Generate practice drill (${unit}${topic ? " — " + topic : ""})`, "user", [], [], true);
      questionEl.value = "";

      const fd = new FormData();
      fd.append("topic", topic);
      fd.append("course_unit", unit);
      fd.append("num_questions", "4");

      practiceBtn.disabled = true;
      const thinkingMsg = addMsg("Generating practice questions from your notes...", "bot", [], [], false);
      try {
        const res = await fetch("/practice", { method: "POST", body: fd });
        const data = await res.json();
        thinkingMsg.remove();
        addMsg(data.answer, "bot", data.sources || [], [], true);
        if (data.answer) {
          chatHistory.push({ role: "assistant", text: data.answer });
          sessionLog.push(`### Practice Drill (${unit})\n${data.answer}`);
          persistChatState();
        }
      } catch (err) {
        thinkingMsg.remove();
        addMsg("Network error: " + err, "bot", [], [], false);
      } finally {
        practiceBtn.disabled = false;
      }
    });

    function buildMarkdownExport() {
      const unit = unitFilterEl.value || "All";
      return `# Assignment AI & Notes Studio (${unit})\n\n` + sessionLog.join("\n\n---\n\n");
    }

    document.getElementById("exportMdBtn").addEventListener("click", () => {
      const md = buildMarkdownExport();
      const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "assignment-notes-session.md";
      a.click();
    });

    document.getElementById("exportDocxBtn").addEventListener("click", async () => {
      const unit = unitFilterEl.value || "All";
      const fd = new FormData();
      fd.append("title", `Assignment Solutions (${unit})`);
      fd.append("content", sessionLog.join("\n\n") || "No session items yet.");
      const res = await fetch("/export/docx", { method: "POST", body: fd });
      const blob = await res.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "assignment-solutions.docx";
      a.click();
    });

    sendBtn.addEventListener("click", sendQuestion);
    questionEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendQuestion();
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(err => console.error("SW error:", err));
      });
    }

    renderFullChat();
    hydrateCachedVault();
    loadFiles();
  </script>
</body>
</html>
